name: dev terraform w/ oidc
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  dev-deploy:
    uses: ryan-hoofard/reusable-workflows/.github/workflows/terraform-aws.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      region: us-east-1
      environment: dev
      role: arn:aws:iam::471112939810:role/Everything



  
